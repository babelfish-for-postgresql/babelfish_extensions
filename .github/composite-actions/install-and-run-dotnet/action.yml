name: 'Run Dotnet tests'
description: 'Install and Run Babel Dotnet Tests'

runs:
  using: "composite"
  steps:
  - name: Clean existing repositories
    run: |
      sudo rm -f /etc/apt/sources.list.d/microsoft*
      sudo rm -f /etc/apt/sources.list.d/mssql*
      sudo rm -f /etc/apt/trusted.gpg.d/microsoft*
      sudo rm -f /usr/share/keyrings/microsoft*
      sudo rm -f /usr/share/keyrings/microsoft-prod*
    shell: bash

  - name: Install MSSQL Tools
    id: install-mssql-tools
    run: |
      curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft.list
      sudo apt-get update
      sudo apt-get install -y mssql-tools18 unixodbc-dev
      echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
      source ~/.bashrc
    shell: bash

  - name: Clean for Dotnet install
    id: clean-dotnet
    if: always() && steps.install-mssql-tools.outcome == 'success'
    run: |
      sudo rm -f /etc/apt/sources.list.d/microsoft*
      sudo rm -f /usr/share/keyrings/microsoft*
    shell: bash

  - name: Install Dotnet
    id: install-dotnet
    if: always() && steps.clean-dotnet.outcome == 'success'
    run: | 
      # Setup repository keys for Dotnet
      curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft.list
      
      sudo apt-get update
      sudo apt-get install -y apt-transport-https
      sudo apt-get install -y dotnet-sdk-8.0
      sudo apt-get install -y aspnetcore-runtime-8.0
    shell: bash
          
  - name: Run Dotnet Tests
    if: always() && steps.install-dotnet.outcome == 'success'
    run: |
      cd test/dotnet
      dotnet build
      VSTEST_DISABLE_STANDARD_OUTPUT_CAPTURING=1 \
      babel_URL=localhost \
        babel_port=1433 \
        babel_databaseName=master \
        babel_user=jdbc_user \
        babel_password=12345678 \
        testName="all---TestUDD.txt;TestChar.txt;TestSqlVariant.txt;TestVarChar.txt;TestAuthentication.txt;TestText.txt" \
        dotnet test
    shell: bash
