       - name: Upload Babelfish Server Log
         if: always()
         uses: actions/upload-artifact@v4
         with:
           name: postgres-log-jdbc
           path: |
             ~/${{env.INSTALL_DIR}}/logfile
             ~/${{env.INSTALL_DIR}}/valgrind_logs
           retention-days: 1