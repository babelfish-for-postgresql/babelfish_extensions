name: Valgrind
on: [push, pull_request]
   # schedule:
     # - cron: '0 0 * * *'  # runs every midnight
   
jobs:
   run-valgrind:
     strategy:
       matrix:
         extension_branch: [BABEL_5_X_DEV]
         # extension_branch: [BABEL_4_X_DEV, BABEL_5_X_DEV]
     runs-on: ubuntu-22.04
     env:
       INSTALL_DIR: psql
     steps:
       - uses: actions/checkout@v2
         id: checkout
 
       - name: Install Dependencies
         id: install-dependencies
         if: always()
         uses: ./.github/composite-actions/install-dependencies
       
       - name: Install Valgrind
         id: install-valgrind
         if: always()
         run: |
           cd ~
           wget -q https://sourceware.org/pub/valgrind/valgrind-3.24.0.tar.bz2
           tar xvf ~/valgrind-3.24.0.tar.bz2
           cd ~/valgrind-3.24.0
           ./configure
           sudo make
           sudo make install
           export "VALGRIND_LIB=/usr/local/libexec/valgrind/" >> $GITHUB_ENV
           sudo apt install -y libc6-dbg
 
       - name: Determine Engine Branch
         id: determine-engine-branch
         run: |
           if [[ "${{ matrix.extension_branch }}" == "BABEL_4_X_DEV" ]]; then
             echo "ENGINE_BRANCH=BABEL_4_X_DEV__PG_16_X" >> $GITHUB_OUTPUT
           elif [[ "${{ matrix.extension_branch }}" == "BABEL_5_X_DEV" ]]; then
             echo "ENGINE_BRANCH=BABEL_5_X_DEV__PG_17_X" >> $GITHUB_OUTPUT
           fi
 
       - name: Build Modified Postgres
         id: build-modified-postgres
         if: always() && steps.determine-engine-branch.outcome == 'success'
         uses: ./.github/composite-actions/build-modified-postgres
         with:
           install_dir: ${{env.INSTALL_DIR}}
           enable_valgrind: 'yes'
           engine_branch: ${{ steps.determine-engine-branch.outputs.ENGINE_BRANCH }}
 
       - name: Compile ANTLR
         id: compile-antlr
         if: always() && steps.build-modified-postgres.outcome == 'success'
         uses: ./.github/composite-actions/compile-antlr
         with:
           install_dir: ${{env.INSTALL_DIR}}
 
       - name: Build Extensions
         id: build-extensions
         if: always() && steps.compile-antlr.outcome == 'success'
         uses: ./.github/composite-actions/build-extensions
         with:
           install_dir: ${{env.INSTALL_DIR}}
 
       - name: Build tds_fdw Extension
         id: build-tds_fdw-extension
         if: always() &&  steps.build-extensions.outcome == 'success'
         uses: ./.github/composite-actions/build-tds_fdw-extension
 
       - name: Build vector Extension
         id: build-vector-extension
         if: always() &&  steps.build-tds_fdw-extension.outcome == 'success'
         uses: ./.github/composite-actions/build-vector-extension
 
       - name: Build PostGIS Extension
         id: build-postgis-extension
         if: always() &&  steps.build-vector-extension.outcome == 'success'
         uses: ./.github/composite-actions/build-postgis-extension
 
       - name: Install Extensions
         id: install-extensions
         if: always() && steps.build-extensions.outcome == 'success'
         uses: ./.github/composite-actions/install-extensions
         with:
           install_dir: ${{env.INSTALL_DIR}}
 
       - name: Stop babelfish server and restart with valgrind
         id: restart-babel-with-valgrind
         if: always() && steps.install-extensions.outcome == 'success'
         timeout-minutes: 3
         run: |
           export WORKSPACE_DIR=~/$INSTALL_DIR
           mkdir -p $WORKSPACE_DIR/valgrind_logs
 
           echo "stopping babelfish server"
           $WORKSPACE_DIR/bin/pg_ctl -c -D $WORKSPACE_DIR/data stop
 
           echo "Starting babelfish server with Valgrind"
           /usr/local/bin/valgrind \
             --leak-check=no \
             --gen-suppressions=all \
             --suppressions=$GITHUB_WORKSPACE/../postgresql_modified_for_babelfish/src/tools/valgrind.supp \
             --track-origins=yes --num-callers=100 --error-exitcode=1 --exit-on-first-error=yes \
             --error-markers=VALGRINDERROR-BEGIN,VALGRINDERROR-END \
             --log-file=$WORKSPACE_DIR/valgrind_logs/%p.log \
             --trace-children=yes \
             $WORKSPACE_DIR/bin/postgres -D $WORKSPACE_DIR/data/ &> $WORKSPACE_DIR/logfile &
           
           echo "Waiting for database to start ..."
           until pg_isready -h localhost -p 5432; do
           echo "Waiting for PostgreSQL to become ready..."
             sleep 2
           done
 
           $WORKSPACE_DIR/bin/psql -v ON_ERROR_STOP=1 -d babelfish_db -U runner -c "SELECT CAST(SYS.SERVERPROPERTY('babelfishinternalversion') AS VARCHAR(110));"
         shell: bash
 
       - name: Run JDBC Tests
         id: run-jdbc-tests
         if: always() && steps.restart-babel-with-valgrind.outcome == 'success'
         timeout-minutes: 300
         uses: ./.github/composite-actions/run-random-jdbc-tests
         with: 
            num_tests: 3
            migration_mode: "multi-db"  # or "single-db" as needed
       
